    <text x="947" y="141" fill="#e1e9df">CALL</text>
    <path d="M1006 134H1034M1028 128L1034 134L1028 140" fill="none" stroke="#b5cf9e" stroke-width="2"/>
    <rect x="1044" y="101" width="118" height="66" rx="8" fill="#b5cf9e"/>
    <text x="1103" y="141" fill="#14211f">TRACE</text>
  </g>
  <text x="54" y="278" fill="#91a79a" font-family="monospace" font-size="13" letter-spacing="2">NO SERVICES TO START. NO KEYS TO CONFIGURE.</text>
</svg>

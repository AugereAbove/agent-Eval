[project]
name = "agent-eval-lab"
version = "0.2.0"
description = "A local tool execution runtime with structured traces and repeatable evaluations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cloudpickle>=3.1,<4", "jsonschema>=4.23,<5"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AugereAbove"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/AugereAbove/agent-Eval"
Issues = "https://github.com/AugereAbove/agent-Eval/issues"
Documentation = "https://github.com/AugereAbove/agent-Eval/blob/main/docs/design.md"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentlab*"]

[tool.setuptools.package-data]
agentlab = ["data/*.json"]
